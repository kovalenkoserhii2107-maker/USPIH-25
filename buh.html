<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <script>
    // iOS Safari ігнорує user-scalable=no: щипок блокуємо тут, щоб застосунок
    // завжди виглядав так, як задумано (подвійний дотик вимкнено в style.css).
    (function () {
        var stop = function (e) { e.preventDefault(); };
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
            document.addEventListener(type, stop, { passive: false });
        });
    })();
    </script>
    <title>Бухгалтерія — ОСББ «Успіх-25»</title>

    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
    <link rel="stylesheet" href="style.css?v=200">
    <link rel="stylesheet" href="style-sv.css?v=200">

    <link rel="modulepreload" href="js/buh-main.js?v=200">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js">
</head>
<body class="buh-mode">

<!-- Кабінет бухгалтера: окрема сторінка й окремий код (js/buh-main.js).
     Система сама пропонує дії — людина підтверджує Enter або «Так».
     Вигляд «Сервіс»: розділи вгорі, одна головна дія на екрані. -->
<div id="navBackdrop" class="nav-backdrop"></div>

<div id="buhMoreSheet" class="sheet mn-sheet">
    <div class="sheet-grabber"></div>
    <div class="sheet-header">
        <h4 class="sheet-title">Меню бухгалтерії</h4>
        <button class="sheet-close" data-close-sheet aria-label="Закрити">✕</button>
    </div>
    <div class="sheet-body" id="buhMoreBody"></div>
</div>

<div class="container">
    <div id="appLoader">
        <div class="turtle">
            <svg width="90" height="70" viewBox="0 0 100 80">
                <ellipse cx="50" cy="45" rx="30" ry="22" fill="#83B799"/>
                <path d="M50 23c-16 0-30 10-30 22h60c0-12-14-22-30-22z" fill="#6BA383"/>
                <circle cx="50" cy="40" r="9" fill="#5C8F72"/>
                <circle cx="35" cy="45" r="6" fill="#5C8F72"/>
                <circle cx="65" cy="45" r="6" fill="#5C8F72"/>
                <ellipse cx="82" cy="42" rx="10" ry="8" fill="#95C7A8"/>
                <circle cx="86" cy="39" r="2" fill="#1D1D1F"/>
                <ellipse cx="26" cy="62" rx="8" ry="5" fill="#95C7A8"/>
                <ellipse cx="70" cy="62" rx="8" ry="5" fill="#95C7A8"/>
            </svg>
        </div>
        <p class="loader-text">Завантаження бухгалтерії…</p>
    </div>

    <div id="buhApp" class="buh" hidden>
        <header class="buh-top">
            <div class="buh-top-row">
                <button class="buh-brand" type="button" data-go="today" aria-label="Сьогодні"><img class="buh-brand-mark app-icon" src="assets/icons/icon-192x192.png" alt="" width="44" height="44"><span><b>Успіх-25</b><small>Бухгалтерія</small></span></button>
                <nav class="buh-nav" aria-label="Розділи бухгалтерії">
                    <button class="buh-nav-item" data-view="today" type="button"><span>Сьогодні</span></button>
                    <button class="buh-nav-item" data-view="inbox" type="button"><span>Рішення</span><span class="buh-badge" id="buhInboxBadge" hidden></span></button>
                    <button class="buh-nav-item" data-view="month" type="button"><span>Місяць</span></button>
                    <button class="buh-nav-item" data-view="charges" type="button"><span>Нарахування</span></button>
                    <button class="buh-nav-item" data-view="bank" type="button"><span>Банк</span></button>
                    <button class="buh-nav-item" data-view="payments" type="button"><span>Платежі</span><span class="buh-badge is-soft" id="buhPayBadge" hidden></span></button>
                    <button class="buh-nav-item" data-view="expenses" type="button"><span>Документи</span></button>
                    <button class="buh-nav-item" data-view="flats" type="button"><span>Квартири</span></button>
                    <button class="buh-nav-item" data-view="payroll" type="button"><span>Зарплата</span></button>
                    <button class="buh-nav-item" data-view="journal" type="button"><span>ОСВ</span></button>
                    <button class="buh-nav-item" data-view="reports" type="button"><span>Звіти</span><span class="buh-badge is-soft" id="buhReportBadge" hidden></span></button>
                </nav>
                <div class="buh-top-tools">
                    <button id="buhSyncChip" class="buh-chip" type="button" title="Оновити виписку з банку">Виписка</button>
                    <button id="buhAccountBtn" class="buh-menu-btn buh-avatar-btn" type="button" aria-label="Меню розділів, профіль і налаштування" title="Відкрити меню: Майно та ТМЦ, Авансові звіти, Претензійна робота, Кошторис, Налаштування">
                        <svg class="buh-menu-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                        <span class="buh-menu-label">Меню</span>
                        <span class="buh-menu-ava" id="buhAccountAva">Б</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="buh-main">

            <section class="buh-view" data-view="today" id="viewToday"><p class="list-empty">Завантаження…</p></section>

            <section class="buh-view" data-view="charges" id="viewCharges"><p class="list-empty">Завантаження…</p></section>

            <section class="buh-view" data-view="budget" id="viewBudget"><p class="list-empty">Завантаження…</p></section>
            <section class="buh-view" data-view="payroll" id="viewPayroll"><p class="list-empty">Завантаження…</p></section>
            <section class="buh-view" data-view="assets" id="viewAssets"><p class="list-empty">Завантаження…</p></section>
            <section class="buh-view" data-view="advance" id="viewAdvance"><p class="list-empty">Завантаження…</p></section>
            <section class="buh-view" data-view="claims" id="viewClaims"><p class="list-empty">Завантаження…</p></section>
            <section class="buh-view" data-view="journal" id="viewJournal"><p class="list-empty">Завантаження…</p></section>
            <section class="buh-view" data-view="reports" id="viewReports"><p class="list-empty">Завантаження…</p></section>
            <section class="buh-view" data-view="payments" id="viewPayments"><p class="list-empty">Завантаження…</p></section>
            <section class="buh-view" data-view="bank" id="viewBank"><p class="list-empty">Завантаження…</p></section>
            <section class="buh-view" data-view="settings" id="viewSettings"><p class="list-empty">Завантаження…</p></section>
        </main>

        <nav class="buh-tabbar" aria-label="Розділи">
            <button class="buh-tab" data-view="today" type="button"><span class="buh-tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg><span class="buh-badge" id="buhInboxBadgeTab" hidden></span></span><span>Сьогодні</span></button>
            <button class="buh-tab" data-view="month" type="button"><span class="buh-tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></span><span>Місяць</span></button>
            <button class="buh-tab" data-view="bank" type="button"><span class="buh-tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18"></path><path d="M12 3 3 8h18z"></path><path d="M5 10v8M9 10v8M15 10v8M19 10v8"></path><path d="M3 21h18"></path></svg></span><span>Банк</span></button>
            <button class="buh-tab" data-view="payments" type="button"><span class="buh-tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></span><span>Платежі</span></button>
            <button class="buh-tab" data-view="expenses" type="button"><span class="buh-tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5M10 13h6M10 17h6"></path></svg></span><span>Документи</span></button>
        </nav>
    </div>
</div>

<script>
// Після підтвердженої помилки імпорту скидаємо воркер із кешем і
// перезавантажуємось один раз за сеанс. Повільна відповідь Auth
// або Firestore сама по собі не скидає кеш і не перезапускає вхід.
(function () {
    var KEY = 'sw_recovery_done';
    window.addEventListener('uspih-module-failed', function () {
        var loader = document.getElementById('appLoader');
        if (!loader || getComputedStyle(loader).display === 'none' || !window.USPihModuleFailed) return;
        if (sessionStorage.getItem(KEY)) return;
        try { sessionStorage.setItem(KEY, '1'); } catch (e) { return; }

        var reload = function () { location.reload(); };
        if (!('serviceWorker' in navigator)) return reload();

        navigator.serviceWorker.getRegistrations()
            .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
            .then(function () { return caches.keys(); })
            .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
            .then(reload, reload);
    });
})();
</script>
<script type="module">
    import('./js/buh-main.js?v=200').catch(error => {
        window.USPihModuleFailed = true;
        console.error('Завантаження бухгалтерії:', error);
        window.dispatchEvent(new Event('uspih-module-failed'));
    });
</script>
</body>
</html>
