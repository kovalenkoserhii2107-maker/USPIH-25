<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстр співвласників | ОСББ «Успіх-25»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ОСББ «Успіх-25»</h1>
        
        <!-- Блок авторизации -->
        <div id="loginSection">
            <h2>Вхід до реєстру</h2>
            <div class="form-group">
                <label for="aptInput">Номер квартири</label>
                <input type="number" id="aptInput" placeholder="Наприклад: 45">
            </div>
            <div class="form-group">
                <label for="passInput">Пароль</label>
                <input type="password" id="passInput" placeholder="Введіть пароль">
            </div>
            <button id="loginBtn">Увійти</button>
            <p id="loginError" class="error-text" style="display: none;">Невірний пароль або номер квартири</p>
        </div>

        <!-- Блок данных (изначально скрыт) -->
        <div id="dataSection" style="display: none;">
            <h2>Дані співвласника</h2>
            <div class="form-group">
                <label for="ownerName">ПІБ власника</label>
                <input type="text" id="ownerName">
            </div>
            <div class="form-group">
                <label for="aptArea">Площа (кв.м)</label>
                <input type="number" id="aptArea" step="0.1">
            </div>
            
            <div class="form-group upload-group">
                <label>Документ на право власності</label>
                <p class="hint">Завантажте фото або скан (PDF, JPG, PNG)</p>
                <input type="file" id="docUpload" accept="image/*,application/pdf">
            </div>

            <button id="saveBtn">Зберегти та відправити</button>
            <button id="logoutBtn" class="btn-secondary">Вийти</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
