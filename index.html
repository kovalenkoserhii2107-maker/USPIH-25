<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстр співвласників | ОСББ «Успіх-25»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ОСББ «Успіх-25»</h1>
        
        <!-- Блок авторизации -->
        <div id="loginSection">
            <h2>Вхід до реєстру</h2>
            <div class="form-group">
                <label for="aptInput">Номер квартири</label>
                <input type="number" id="aptInput" placeholder="Наприклад: 45">
            </div>
            <div class="form-group">
                <label for="passInput">Пароль</label>
                <input type="password" id="passInput" placeholder="Введіть пароль">
            </div>
            <button id="loginBtn">Увійти</button>
            <p id="loginError" class="error-text" style="display: none;">Невірний пароль або номер квартири</p>
        </div>
        
        <!-- Блок смены пароля (изначально скрыт) -->
        <div id="passwordSection" style="display: none;">
            <h2>Зміна пароля</h2>
            <p class="hint">З метою безпеки змініть тимчасовий пароль на власний.</p>
            <div class="form-group">
                <label for="newPass">Новий пароль</label>
                <input type="password" id="newPass" placeholder="Мінімум 4 символи">
            </div>
            <div class="form-group">
                <label for="confirmPass">Повторіть новий пароль</label>
                <input type="password" id="confirmPass" placeholder="Повторіть пароль">
            </div>
            <button id="savePassBtn">Зберегти пароль</button>
            <p id="passError" class="error-text" style="display: none;"></p>
        </div>
        
        <!-- Блок данных -->
        <div id="dataSection" style="display: none;">
            <h2>Дані по квартирі</h2>
            <div class="form-group">
                <label for="aptArea">Загальна площа квартири (кв.м)</label>
                <input type="number" id="aptArea" step="0.1" placeholder="Наприклад: 65.4">
            </div>
            
            <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Співвласники</h3>
                <button id="addOwnerBtn" class="btn-secondary" style="width: auto; padding: 5px 10px; margin: 0;">+ Додати</button>
            </div>
            
            <div id="ownersContainer">
                <!-- Сюди будуть додаватись блоки власників -->
            </div>
            
            <button id="logoutBtn" class="btn-secondary" style="margin-top: 30px;">Вийти з кабінету</button>
        </div>
        
    </div>
    <script src="app.js"></script>
</body>
</html>
