name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run ci
      - run: npm audit --omit=dev --audit-level=high --prefix functions
      - name: Firestore and Storage rules
        run: npx firebase emulators:exec --project uspih-25-rules-test --only firestore,storage "npm run test:rules"
